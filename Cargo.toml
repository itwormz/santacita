[workspace]
members = ["crates/ceh-core", "crates/ceh-browser", "crates/ceh-store", "crates/ceh-services", "crates/ceh-cli", "crates/ceh-desktop"]
resolver = "3"

[workspace.package]
version = "0.4.9-dev.14"
edition = "2024"
rust-version = "1.100"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "=2.5.9"
sha2 = "0.11"
hex = "=0.4.3"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

yaml-rust2 = { version = "=0.13.1", default-features = false }
num-bigint = "=0.5.1"

rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled", "backup", "functions"] }
chrono-tz = "=0.10.4"

# Native distributions: optimized code without debug/symbol payloads.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
debug = 0
incremental = false
